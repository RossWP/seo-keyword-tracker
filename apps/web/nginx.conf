server {
  listen 8080;
  root /usr/share/nginx/html;

  # Same origin for the browser: /api goes to the API, so no CORS and cookies just work.
  # The Host header is passed through because the API compares it with the request's Origin.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-Id $request_id;
  }

  location = /health {
    proxy_pass http://api:3000;
    proxy_set_header Host $http_host;
  }

  # Hashed build assets never change: cache them for a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Client-side routes (/pages/…, /clients) all load the app.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
